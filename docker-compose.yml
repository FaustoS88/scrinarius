version: "3.9"
services:
  opensearch:
    image: scrinarius-opensearch:latest
    environment:
      - discovery.type=single-node
      # The API sends a file as base64 in one JSON string: 50 MiB is about 70 million characters, past OpenSearch's default of 50 million
      - OPENSEARCH_JAVA_OPTS=-Dopensearch.xcontent.string.length.max=70000000
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set it in .env, see .env.example}
    ports:
      - "9200:9200"
