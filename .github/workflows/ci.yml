name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  smoke:
    name: Smoke test against OpenSearch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write .env with an admin password made for this run
        run: |
          pw="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$pw"
          printf "OPENSEARCH_INITIAL_ADMIN_PASSWORD='%s'\n" "$pw" > .env
      - name: Start OpenSearch
        run: |
          docker build -t scriniarius-opensearch:latest .
          docker compose up -d --wait opensearch
      - name: Create the ingest pipeline and the API key
        run: |
          ./scripts/setup-opensearch.sh
          set -a; . ./.env; set +a
          echo "::add-mask::$OPENSEARCH_API_KEY"
      - name: Start the API and the page
        run: |
          docker compose up -d --build
          timeout 120 sh -c 'until curl -sf -o /dev/null http://localhost:3000/search; do sleep 2; done'
      - run: ./scripts/smoke-test.sh
      - name: The page is served
        run: curl -sf http://localhost:5173 | grep -q '<title>scriniarius</title>'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100 || true
